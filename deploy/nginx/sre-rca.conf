# Include this server block only after TLS is configured for the gateway domain.
# Only the health endpoint and the explicitly configured CloudMonitor callback
# routes are exposed through Nginx.
server {
    listen 443 ssl http2;
    server_name <gateway.example.com>;

    ssl_certificate     <path-to-fullchain.pem>;
    ssl_certificate_key <path-to-privkey.pem>;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
    }

    location = /v1/inbound/cloudmonitor {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;
    }

    # Retain this only while capturing and validating a new callback contract.
    location = /v1/inbound/cloudmonitor/capture {
        access_log off;
        proxy_pass http://127.0.0.1:8080/v1/inbound/cloudmonitor/capture;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;
    }

    location / {
        return 404;
    }
}
