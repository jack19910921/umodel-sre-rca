---
kind: entity_set_link
schema: {url: umodel.aliyun.com, version: v0.1.0}
metadata:
  name: sre.service_serves_sre.service_endpoint
  domain: sre
  display_name: {en_us: Service Serves Endpoint, zh_cn: 服务提供端点}
  description: {en_us: A business service serves one or more monitored endpoints., zh_cn: 一个业务服务提供一个或多个被监控端点。}
spec:
  src: {domain: sre, kind: entity_set, name: sre.service}
  dest: {domain: sre, kind: entity_set, name: sre.service_endpoint}
  entity_link_type: serves
  fields_mapping: {service_id: service_id}
---
kind: entity_set_link
schema: {url: umodel.aliyun.com, version: v0.1.0}
metadata:
