  display_name: {en_us: Endpoint Hosted by ECS Instance, zh_cn: 端点部署在 ECS 实例}
  description: {en_us: A monitored endpoint is hosted by an existing acs ECS instance., zh_cn: 被监控端点部署在已有的 acs ECS 实例上。}
spec:
  src: {domain: sre, kind: entity_set, name: sre.service_endpoint}
  dest: {domain: acs, kind: entity_set, name: acs.ecs.instance}
  entity_link_type: hosted_by
  fields_mapping: {account_id: account_id, region_id: region_id, instance_id: instance_id}
---
kind: data_link
schema: {url: umodel.aliyun.com, version: v0.1.0}
