bindings:
  - id: endpoint_context
    evidence_class: context
    target: sre.service_endpoint
    provider: aliyun.umodel
    query_template: endpoint_context_v1
    selector_mapping:
      endpoint_id: endpoint_id

  - id: endpoint_runs_on_topology
    evidence_class: context
    target: sre.service_endpoint
    provider: aliyun.umodel
    query_template: endpoint_topology_v1
    selector_mapping:
      endpoint_id: endpoint_id

  - id: ecs_cpu_window
    evidence_class: metrics
    target: acs.ecs.instance
    provider: aliyun.cloudmonitor
    query_template: ecs_normal_state_window_v1
    selector_mapping:
      instance_id: instance_id
      region_id: region_id

  - id: nginx_access_log
    evidence_class: logs
    target: sre.service_endpoint
    provider: aliyun.sls
    query_template: nginx_access_by_window_v1
    selector_mapping:
      endpoint_id: endpoint_id
      instance_id: instance_id
    console_link_template: https://sls.console.aliyun.com/lognext/project/${sls_project}/logsearch/${sls_logstore}
